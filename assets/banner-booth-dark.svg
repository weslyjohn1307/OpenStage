<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#181B22" stroke-width="1"/>
    </pattern>
    <linearGradient id="hStar" x1="20" y1="16" x2="140" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="hPlane" x1="24" y1="30" x2="136" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="8" fill="#0A0B0E" stroke="#363C4A" stroke-width="2"/>
  <rect x="4" y="4" width="1192" height="312" rx="6" fill="url(#grid)"/>
  <!-- Top Broadcast Status Rail -->
  <rect x="4" y="4" width="1192" height="36" fill="#101217"/>
  <line x1="4" y1="40" x2="1196" y2="40" stroke="#222630" stroke-width="1"/>
  <circle cx="26" cy="22" r="5" fill="#F59E0B"/>
  <text x="40" y="26" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#FBBF24" letter-spacing="0.8">DESIGN PREVIEW · 120 FPS TARGET · OFFLINE</text>
  <text x="920" y="26" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#6EE7B7">[● FREE FOREVER · GPL-3.0]</text>

  <!-- Left: Aperture Beacon mark (brand pack: logo-horizontal-dark.svg) -->
  <g transform="translate(64, 76) scale(1.3125)">
    <rect x="6" y="6" width="116" height="116" rx="28" fill="#101217" stroke="#363C4A" stroke-width="1.5"/>
    <g transform="rotate(-14 64 64)">
      <rect x="24" y="34" width="80" height="60" rx="6" fill="url(#hPlane)" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5"/>
    </g>
    <g transform="rotate(14 64 64)">
      <rect x="24" y="34" width="80" height="60" rx="6" fill="url(#hPlane)" stroke="#C4B5FD" stroke-opacity="0.6" stroke-width="1.5"/>
    </g>
    <path d="M64 16 L77 51 L112 64 L77 77 L64 112 L51 77 L16 64 L51 51 Z" fill="url(#hStar)" stroke="#EDE9FE" stroke-width="1.5"/>
    <path d="M64 50 L68 60 L78 64 L68 68 L64 78 L60 68 L50 64 L60 60 Z" fill="#FBBF24"/>
  </g>

  <!-- Right: Wordmark, Hardware Spec Plate & Architecture Tagline -->
  <text x="268" y="138" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="68" font-weight="800" letter-spacing="-2.2" fill="#FAFAFA">Open<tspan fill="#A78BFA">Stage</tspan></text>
  <rect x="640" y="96" width="268" height="32" rx="4" fill="#161920" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="774" y="117" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#FBBF24">v4.0 · RUST + WGPU + TAURI v2</text>

  <text x="270" y="182" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="20" font-weight="500" fill="#A6ABB8">Songs, Scripture and media on every screen, in any language.</text>

  <!-- Bottom Hardware Keycap Pill Row -->
  <g transform="translate(270, 206)" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">
    <rect x="0" y="0" width="186" height="30" rx="4" fill="#161920" stroke="#363C4A"/>
    <text x="93" y="19" text-anchor="middle" fill="#F4F3EF">[F] SCRIPTURE FOCUS</text>

    <rect x="198" y="0" width="206" height="30" rx="4" fill="#161920" stroke="#06B6D4"/>
    <text x="301" y="19" text-anchor="middle" fill="#67E8F9">[W] WORD STUDY</text>

    <rect x="416" y="0" width="214" height="30" rx="4" fill="#161920" stroke="#10B981"/>
    <text x="523" y="19" text-anchor="middle" fill="#6EE7B7">MULTI-LANGUAGE TEXT</text>

    <rect x="642" y="0" width="224" height="30" rx="4" fill="#161920" stroke="#F59E0B"/>
    <text x="754" y="19" text-anchor="middle" fill="#FBBF24">OFFLINE CAPTIONS</text>
  </g>
</svg>
